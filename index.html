function renderCreate(){return intro('今天，让你的好产品出圈。','上传商品、选个灵感，剩下的交给邻里 AI。',`<button class="secondary" data-action="sample">${icon('play')} 体验示例</button>`)+brandStrip()+steps()+`<div class="creation-grid"><section class="panel"><div class="panel-head"><h2><span class="number">01</span>这次想推广什么？</h2><small>商品信息</small></div><div class="upload-product"><div class="product-thumb"><img src="${state.product}" alt="商品图片"></div><div><h4>${state.product===productArt?'示例商品图已就绪':'商品图片已上传'}</h4><p>支持 JPG、PNG、WebP<br>一张清晰商品图，就能开始</p><button data-action="product-upload">${icon('upload')} 更换商品图</button></div><span class="check-bubble">✓</span></div><div class="field"><label for="productName">商品名称</label><input id="productName" data-field="name" value="${esc(state.name)}" placeholder="例如：黄油可颂双人套餐" maxlength="60"></div><div class="form-row"><div class="field"><label for="price">团购价 <span>元</span></label><div class="input-prefix"><span>¥</span><input id="price" data-field="price" type="number" min="0.01" step="0.01" value="${esc(state.price)}"></div></div><div class="field"><label for="original">日常价 <span>元 · 选填</span></label><div class="input-prefix"><span>¥</span><input id="original" data-field="original" type="number" min="0" step="0.01" value="${esc(state.original)}"></div></div></div><div class="field"><label for="selling">核心卖点 <span>告诉顾客为什么值得买</span></label><textarea id="selling" data-field="selling" maxlength="240">${esc(state.selling)}</textarea></div><div class="field"><label for="benefit">优惠利益点 <span>套餐内容 / 到店权益</span></label><input id="benefit" data-field="benefit" value="${esc(state.benefit)}" maxlength="160"></div><div class="material-action"><button class="secondary" data-action="views">${icon('box')} ${state.views?'查看商品三视图':'生成商品三视图'} ${state.views?'✓':''}</button><p>补全商品角度，让后续镜头更连贯 · 演示</p></div></section><section class="panel"><div class="panel-head"><div><h2><span class="number">02</span>找一个，适合你的灵感</h2><p class="panel-sub">跟上好内容，把主角换成你的商品。</p></div><span class="badge warm">灵感推荐</span></div><div class="tabs"><button class="${state.tab==='recommend'?'active':''}" data-tab="recommend">${icon('flame')} 推荐热点</button><button class="${state.tab==='upload'?'active':''}" data-tab="upload">${icon('upload')} 上传参考视频</button></div>${state.tab==='recommend'?`<div class="filter-row">${filters()}<span class="refresh">${icon('refresh')} 模拟热度</span></div><div class="trend-grid">${filteredTrends().slice(0,3).map(trendCard).join('')}</div><div class="recommend-note">${icon('spark')}<div><strong>为你的商品找到表达方式</strong><br>${state.trend===null?'已选择自由创作，围绕商品卖点自动编排分镜。':`「${esc(trends[state.trend]?.title||'下午茶')}」适合展示商品细节，用场景种草承接团购优惠。`}</div></div><div style="display:flex;justify-content:space-between;margin-top:16px"><button class="text-btn" data-page="trends">浏览更多灵感 ${icon('arrow')}</button><button class="text-btn" data-action="no-trend">${state.trend===null?'✓ 已选择自由创作':'不跟热点，自由创作'}</button></div>`:uploadTab()}</section></div><div class="generation-bar"><div><h4>${icon('check')} 商品 + 品牌 + 灵感，准备就绪</h4><p id="summary">${esc(brand().brand)} · ${esc(state.name)} · ${state.tab==='upload'?(state.refName?esc(state.refName):'待上传参考视频'):state.trend===null?'自由创作':esc(trends[state.trend].title)}</p></div><button class="primary" data-action="generate">${icon('spark')} 一键生成我的视频 ${icon('arrow')}</button></div><p class="below-hint">演示流程约 8 秒 · 生成结果为预设动态分镜，可替换为你提供的成片</p>`}
function filters(){return `<div class="chips">${['全部','烘焙茶饮','餐饮美食','到店探店'].map(c=>`<button class="chip ${state.category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div>`}function filteredTrends(){return trends.map((t,i)=>({...t,id:i})).filter(t=>state.category==='全部'||t.category===state.category)}
function trendCard(t){return `<button class="trend-card ${state.trend===t.id?'selected':''}" data-trend="${t.id}" aria-label="选择 ${esc(t.title)}" aria-pressed="${state.trend===t.id}"><div class="trend-cover"><img src="${t.image}" alt="${esc(t.title)}示意图"><span class="top-tag ${t.id===0?'hot':''}">${t.tag}</span><span class="play">▶</span><div class="cover-caption">${esc(t.caption).replace(/\n/g,'<br>')}</div><span class="duration">${t.secs}</span></div>${state.trend===t.id?'<span class="selected-indicator">✓</span>':''}<div class="trend-info"><h3>${t.title}</h3><div class="metric"><span>↗ ${t.heat}</span><span>${t.growth}</span></div><span class="fit">适合 ${t.fit}</span></div></button>`}
function uploadTab(){return `<div class="upload-zone" id="videoDrop">${state.refUrl?`<video src="${state.refUrl}" controls playsinline></video><h3>${esc(state.refName)}</h3><button class="secondary" data-action="ref-upload">更换参考视频</button>`:`<div class="upload-icon">${icon('upload')}</div><h3>把你想跟的视频，放到这里</h3><p>拖入视频或点击上传<br>MP4 / MOV / WebM · 演示仅本地预览</p><button class="primary" data-action="ref-upload">上传参考视频</button>`}</div><div class="sample-reference">手边没有视频？<button data-action="sample-ref">使用「下午茶仪式感」示例</button></div>${state.refName?`<div class="analysis-preview"><button class="secondary" data-action="analyse">${icon('spark')} ${state.analysed?'重新反推 Prompt':'拆解视频，反推 Prompt'}</button><p>演示将加载预设拆解，可编辑、复制，再适配你的商品。</p>${state.analysed?`<textarea id="reversePrompt" aria-label="反推 Prompt">${esc(state.reverse)}</textarea><button class="text-btn" data-action="copy-reverse" style="margin-top:10px">${icon('copy')} 复制反推 Prompt</button>`:''}</div>`:''}`}
function renderTrends(){return intro('好内容，从一个灵感开始。','为本地生活筛选的内容模板，把热点变成自家生意的表达。',`<button class="secondary" data-action="go-upload">${icon('upload')} 上传自己的参考视频</button>`)+`<div class="notice">${icon('flame')} 热点热度、涨幅与适配建议均为虚拟示例。选择模板后，会自动带回创作台。</div><div class="section-bar">${filters()}<input class="search" id="trendSearch" placeholder="搜索灵感，例如：下午茶" aria-label="搜索热点"></div><section class="full-trends"><div class="trend-grid" id="allTrends">${filteredTrends().map(trendCard).join('')}</div></section>`}
function renderBrands(){return intro('你的品牌，始终如一。','把 Logo、门店照片与展示规则存成一组。首次设置，之后每次自动带入。',`<button class="primary" data-action="new-brand">${icon('plus')} 新建素材组</button>`)+`<div class="notice">${icon('lock')} 品牌素材组会保存在当前浏览器。制作时选择门店即可复用；上传的 Logo 作为原图叠加，保留原始比例。</div><div class="asset-grid">${brands.map(b=>`<article class="asset-card"><div class="asset-cover"><img src="${b.photos[0]||storeArt}" alt="${esc(b.name)}门店"><span class="badge">${b.default?'✓ 默认素材组':'品牌素材组'}</span></div><div class="asset-body"><h3>${esc(b.name)}</h3><p>${b.logo?'1 个 Logo':'文字品牌标识'} · ${b.photos.length} 张门店图片 · ${b.position}展示</p><div class="asset-actions"><button class="secondary" data-action="edit-brand" data-id="${b.id}">${icon('edit')} 编辑素材</button><button class="text-btn" data-action="default-brand" data-id="${b.id}">${b.default?'当前默认':'设为默认'}</button></div></div></article>`).join('')}<button class="add-card" data-action="new-brand">${icon('plus')}<strong>添加另一个品牌或门店</strong><span>不同门店，各有自己的素材组</span></button></div>`}
function renderWorks(){return intro('每一条内容，都为好生意。','在这里找到做过的内容，继续调整，或者再次使用。',`<button class="primary" data-page="create">${icon('plus')} 新建创作</button>`)+(works.length?`<div class="work-grid">${works.map((w,i)=>`<article class="work-card"><div data-action="open-work" data-index="${i}">${phoneMarkup(w,false)}</div><h3>${esc(w.name)}</h3><p>${esc(w.brandName)} · ${esc(w.date)} · 演示作品</p><button class="text-btn" data-action="open-work" data-index="${i}">查看作品 ${icon('arrow')}</button></article>`).join('')}</div>`:`<div class="panel empty">${icon('film')}<h3>下一条好内容，从这里开始</h3><p>完成首次创作后，作品会出现在这里。</p><button class="primary" data-page="create">开始我的第一条创作 ${icon('arrow')}</button></div>`)}
function bindFields(){$$('[data-field]').forEach(e=>e.oninput=()=>{state[e.dataset.field]=e.value;if(e.dataset.field==='name')$('#summary').textContent=`${brand().brand} · ${state.name}`});if($('#activeBrand'))$('#activeBrand').onchange=e=>{state.brandId=e.target.value;render();toast('已切换素材组，Logo 与门店已同步带入')};if($('#reversePrompt'))$('#reversePrompt').oninput=e=>state.reverse=e.target.value;if($('#trendSearch'))$('#trendSearch').oninput=e=>{$('#allTrends').innerHTML=filteredTrends().filter(t=>t.title.includes(e.target.value)||t.fit.includes(e.target.value)).map(trendCard).join('')||'<p class="muted">没有匹配的灵感，换个关键词试试。</p>'};const d=$('#videoDrop');if(d){d.ondragover=e=>{e.preventDefault();d.classList.add('drag')};d.ondragleave=()=>d.classList.remove('drag');d.ondrop=e=>{e.preventDefault();d.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)loadRef(f)}}}
async function compressedImage(file){if(!file.type.startsWith('image/'))throw Error('请选择图片文件');if(file.size>15*1024*1024)throw Error('请选择小于 15MB 的图片');const img=new Image();const url=URL.createObjectURL(file);try{await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(Error('无法读取这张图片，请换成 JPG 或 PNG'));img.src=url});const c=document.createElement('canvas');const scale=Math.min(1,1000/img.width,1000/img.height);c.width=img.width*scale;c.height=img.height*scale;c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}
function pick(accept,callback,multiple=false){const p=$('#filePicker');p.accept=accept;p.multiple=multiple;p.value='';p.onchange=async()=>{try{await callback(multiple?[...p.files]:p.files[0])}catch(e){toast(e.message||'文件读取失败，请重试')}};p.click()}
function loadRef(f){if(!f.type.startsWith('video/'))return toast('请选择 MP4、MOV 或 WebM 视频');if(state.refUrl)URL.revokeObjectURL(state.refUrl);state.refUrl=URL.createObjectURL(f);state.refName=f.name;state.analysed=false;state.tab='upload';render();toast('参考视频已载入，点击反推可查看模拟拆解')}
function reversePrompt(){return `【参考视频反推 · 演示模板】\n规格：9:16 竖屏，15 秒，暖调自然光。\n0–3s：下午茶桌面，慢推近景；字幕“下午三点，给自己放个小假”。\n3–7s：产品侧面与俯拍交替，展现酥皮层次；每个镜头 1–2 秒。\n7–11s：手部掰开产品，特写切至套餐全貌；突出核心卖点。\n11–15s：门店实拍与价格卡，团购到店引导。\n声音：轻快节拍，搭配酥皮拟音；字幕随节拍出现。\n品牌要求：上传的 Logo 原图叠加、等比缩放；门头使用真实上传素材。\n注：此为固定示例拆解，不代表对上传视频的真实识别。`}
function viewModal(){state.views=true;showModal(modalHead('商品三视图','正面、侧面、背面，为后续镜头准备参考。')+`<div class="tri-grid">${['正面参考','侧面占位示意','背面占位示意'].map(t=>`<div class="tri-card"><img src="${state.product}" alt="${t}"><p>${t}</p></div>`).join('')}</div><div class="tri-note">当前为交互演示：侧面、背面使用原图形变占位，不是真实 AI 补全结果。正式版本中，生成角度需要商家核对是否符合实物。</div><div class="modal-actions"><button class="primary" data-action="confirm-views">确认参考，继续创作 ${icon('arrow')}</button></div>`)}
function editBrand(id){editingBrand=JSON.parse(JSON.stringify(brands.find(b=>b.id===id)||{id:'brand-'+Date.now(),name:'',brand:'',logo:'',photos:[],color:'#174f45',position:'左上角',lock:true,end:true,default:false}));renderBrandEditor()}
function renderBrandEditor(){const b=editingBrand;showModal(modalHead(b.name?'编辑品牌素材组':'建立你的品牌素材组','保存后自动复用，制作视频时无需重复上传。')+`<div class="asset-editor-grid"><div><div class="field" style="margin-top:0"><label for="groupName">素材组名称</label><input id="groupName" value="${esc(b.name)}" placeholder="例如：麦屿烘焙 · 湖滨店"></div><div class="field"><label for="brandName">品牌名称</label><input id="brandName" value="${esc(b.brand)}" placeholder="例如：麦屿烘焙"></div><div class="field"><label>品牌 Logo <span>推荐透明底 PNG</span></label><div class="asset-upload">${b.logo?`<img src="${b.logo}" alt="Logo 预览">`:icon('layers')}<button class="text-btn" data-action="logo-upload">${icon('upload')} ${b.logo?'更换 Logo':'上传 Logo'}</button></div></div></div><div><div class="field" style="margin-top:0"><label>门头与店内照片 <span>支持多张</span></label><div class="asset-upload wide">${b.photos.length?`<div class="asset-photos">${b.photos.map((p,i)=>`<div><img src="${p}" alt="门店素材 ${i+1}"><button class="edit-inline" data-action="remove-photo" data-index="${i}">移除</button></div>`).join('')}</div>`:icon('store')}<button class="text-btn" data-action="store-upload">${icon('plus')} 添加门店图片</button></div></div><div class="form-row"><div class="field"><label for="logoPosition">Logo 展示位置</label><select id="logoPosition">${['左上角','右上角','仅结尾'].map(x=>`<option ${x===b.position?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="brandColor">品牌主色</label><input id="brandColor" type="color" value="${b.color}" style="height:36px;padding:3px"></div></div><div class="toggles"><label>保持 Logo 比例和原色<input id="lockLogo" type="checkbox" ${b.lock?'checked':''}></label><label>结尾展示品牌与门店<input id="endLogo" type="checkbox" ${b.end?'checked':''}></label><label>设为默认素材组<input id="defaultBrand" type="checkbox" ${b.default?'checked':''}></label></div></div></div><div class="modal-actions"><button class="secondary" data-action="close">取消</button><button class="primary" data-action="save-brand">保存素材组 ${icon('check')}</button></div>`)}
function collectBrand(){if(!$('#groupName'))return;Object.assign(editingBrand,{name:$('#groupName').value.trim(),brand:$('#brandName').value.trim(),position:$('#logoPosition').value,color:$('#brandColor').value,lock:$('#lockLogo').checked,end:$('#endLogo').checked,default:$('#defaultBrand').checked})}
function saveBrand(){collectBrand();if(!editingBrand.name||!editingBrand.brand)return toast('请填写素材组名称和品牌名称');const prev=JSON.parse(JSON.stringify(brands));if(editingBrand.default)brands.forEach(x=>x.default=false);const i=brands.findIndex(b=>b.id===editingBrand.id);if(i<0)brands.push(editingBrand);else brands[i]=editingBrand;if(!saveBrands()){brands=prev;return}state.brandId=editingBrand.id;closeModal();render();toast('素材组已保存，下次创作直接复用')}
function buildResult(){const b=brand();const t=state.trend!==null?trends[state.trend]:null;return {id:Date.now(),name:state.name,price:state.price,original:state.original,selling:state.selling,benefit:state.benefit,product:state.product,brandName:b.brand,brandLogo:b.logo,store:b.photos[0]||storeArt,position:b.position,end:b.end,color:b.color,trend:state.tab==='upload'?state.refName:t?.title||'自由创作',hook:t?.hook||'今天，给自己一点小奖励',style:t?.style||'商品特写，套餐展示，门店引导',date:new Date().toLocaleDateString('zh-CN'),reverse:state.reverse,shots:[{time:'00–03s',name:'开场钩子 · 留住注意力',desc:`${t?.hook||'今天，给自己一点小奖励'}。以商品近景切入，建立消费场景。`},{time:'03–07s',name:'商品特写 · 放大购买理由',desc:state.selling},{time:'07–11s',name:'套餐全貌 · 讲清实惠',desc:`团购价 ¥${state.price}；${state.benefit}`},{time:'11–15s',name:'品牌收尾 · 引导到店',desc:`${b.brand}，门店实拍与品牌 Logo，点击团购到店享用。`}]}}
function generate(){if(!state.name.trim()||!state.selling.trim()||!Number.isFinite(+state.price)||+state.price<=0)return toast('请填写商品名称、有效团购价与核心卖点');if(state.original&&+state.original<+state.price)return toast('日常价应不低于团购价，请核对价格');if(state.tab==='upload'&&!state.refName)return toast('请上传参考视频，或先使用示例');if(state.tab==='upload'&&!state.reverse)state.reverse=reversePrompt();const labels=['读取商品与品牌素材','拆解内容结构与镜头节奏','适配商品卖点与优惠信息','合成动态分镜演示'];let step=0;showModal(`<div class="progress-wrap"><div class="orb">${icon('spark')}</div><h2>好内容，正在发生。</h2><p>为 ${esc(brand().brand)} 编排专属内容</p><div class="progress-track"><div id="jobBar" style="width:8%"></div></div><div class="progress-list">${labels.map((l,i)=>`<div class="progress-item ${i===0?'current':''}" id="job-${i}"><span>${l}</span><span>${i===0?'进行中':'等待中'}</span></div>`).join('')}</div><p>虚拟流程演示 · 无实际 AI 推理</p></div>`);jobTimer=setInterval(()=>{const old=$('#job-'+step);if(old){old.className='progress-item done';old.lastElementChild.textContent='✓ 已完成'}step++;if(step<4){const next=$('#job-'+step);next.className='progress-item current';next.lastElementChild.textContent='进行中';$('#jobBar').style.width=(step+1)*24+'%'}else{clearInterval(jobTimer);state.result=buildResult();works.unshift(state.result);works=works.slice(0,12);try{localStorage.setItem('linli-works',JSON.stringify(works))}catch{toast('作品已生成，图片较大，本次仅保留在当前会话')}showResult(state.result)}},1700)}

function showResult(w,tab='script'){state.result=w;showModal(modalHead('你的下一条好内容，准备好了。',`${esc(w.brandName)} · 9:16 竖屏 · 15 秒演示`)+`<div class="result-grid"><div>${phoneMarkup(w)}<p style="font-size:9px;color:var(--sub);margin-top:10px;text-align:center">${state.resultVideo?'你提供的预制视频 · 本地预览':'动态分镜演示 · 非 AI 生成视频'}</p><button class="text-btn" data-action="result-video" style="display:flex;margin:13px auto">${icon('upload')} ${state.resultVideo?'替换预制成片':'导入预先生成好的成片'}</button></div><div><div class="result-banner">✓ 已应用品牌素材组：${esc(w.brandName)} · Logo 与门店素材已带入</div><div class="result-tabs">${[['script','分镜脚本'],['prompt','生成 Prompt'],['publish','发布文案']].map(([id,n])=>`<button data-result-tab="${id}" class="${tab===id?'active':''}">${n}</button>`).join('')}</div>${tab==='script'?w.shots.map(s=>`<div class="shot"><div class="shot-time">${s.time}</div><div><h4>${s.name}</h4><p>${esc(s.desc)}</p></div></div>`).join(''):tab==='prompt'?`<textarea class="prompt-area" id="finalPrompt" aria-label="生成 Prompt">${esc(w.editedPrompt||resultPrompt(w))}</textarea><button class="text-btn" style="margin-top:12px" data-action="copy-final">${icon('copy')} 复制 Prompt</button>`:`<div class="field"><label>标题</label><input id="publishTitle" value="${esc(w.hook+'｜'+w.brandName)}"></div><div class="field"><label>配文</label><textarea id="publishCopy" style="height:160px">${esc(`${w.selling}\n${w.benefit}\n团购价 ¥${w.price}，来 ${w.brandName} 享受今天的小美好。\n#同城好店 #下午茶 #${w.brandName}`)}</textarea></div><button class="text-btn" data-action="copy-publish">${icon('copy')} 复制发布文案</button>`}<div class="result-actions"><button class="secondary" data-action="change-hook">${icon('refresh')} 换一个开头</button><button class="secondary" data-action="highlight-price">${icon('spark')} 突出优惠</button><button class="secondary" data-action="download-script">${icon('download')} 导出脚本</button></div></div></div><div class="modal-actions"><button class="secondary" data-action="view-works">前往我的作品</button><button class="primary" data-act function startPlayer(w){playSec=0;playing=true;playTimer=setInterval(()=>{if(!playing)return;playSec=(playSec+.2)%15;const idx=playSec<3?0:playSec<7?1:playSec<11?2:3;const captions=[w.hook,w.selling.split(/[·，,]/).slice(0,2).join('\n'),`¥${w.price}\n${w.benefit}`,`来 ${w.brandName}\n享受这一刻`];if($('#phoneCaption'))$('#phoneCaption').textContent=captions[idx];if($('#phoneBg'))$('#phoneBg').src=idx===3?w.store:w.product;if($('#phoneLogo'))$('#phoneLogo').style.display=w.position==='仅结尾'?(idx===3&&w.end?'block':'none'):(idx===3&&!w.end?'none':'block');if($('#playProgress'))$('#playProgress').style.width=playSec/15*100+'%';if($('#playTime'))$('#playTime').textContent=`00:${Math.floor(playSec).toString().padStart(2,'0')} / 00:15`},200)}

async function exportVideo(){if(state.resultVideo){const res=await fetch(state.resultVideo);downloadBlob(await res.blob(),state.resultVideoName||'邻里-预制成片.mp4');return}if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return toast('当前浏览器不支持视频导出，可先导出脚本或导入预制视频');const w=state.result;const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src});toast('开始导出 15 秒演示视频，请保持页面打开');try{const [product,store,logo]=await Promise.all([load(w.product),load(w.store),w.brandLogo?load(w.brandLogo):Promise.resolve(null)]);const c=document.createElement('canvas');c.width=540;c.height=960;const ctx=c.getContext('2d');const stream=c.captureStream(24);const mime=['video/webm;codecs=vp9','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error();const rec=new MediaRecorder(stream,{mimeType:mime});const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{downloadBlob(new Blob(chunks,{type:mime}),'邻里-'+w.name+'-演示.'+(mime.includes('mp4')?'mp4':'webm'));stream.getTracks().forEach(t=>t.stop());toast('演示视频已导出')};const start=performance.now();function draw(){const elapsed=(performance.now()-start)/1000;const idx=elapsed<3?0:elapsed<7?1:elapsed<11?2:3;const im=idx===3?store:product;const scale=Math.max(540/im.width,960/im.height)*(1+elapsed%4*.01);ctx.drawImage(im,(540-im.width*scale)/2,(960-im.height*scale)/2,im.width*scale,im.height*scale);const gr=ctx.createLinearGradient(0,200,0,960);gr.addColorStop(0,'#00000000');gr.addColorStop(1,'#000000bb');ctx.fillStyle=gr;ctx.fillRect(0,0,540,960);if(w.position!=='仅结尾'||idx===3&&w.end){const lx=w.position==='右上角'?390:28;if(logo){const width=118,height=width*logo.height/logo.width;ctx.drawImage(logo,lx,28,width,Math.min(height,80))}else{ctx.fillStyle='#fff';ctx.font='22px sans-serif';ctx.fillText(w.brandName,lx,55)}}ctx.fillStyle='#fff';ctx.font='bold 43px sans-serif';const text=[w.hook,w.selling,`团购价 ¥${w.price}`,`来 ${w.brandName}`][idx];wrapText(ctx,t function configData(){const t=selectedTemplate(),b=brand();return {personMode:state.personMode,person:state.personMode==='keep'?(t.person||'模板虚拟顾客'):[state.personRole,state.personNote.trim()].filter(Boolean).join('，'),personImage:state.personMode==='replace'?state.personImage:'',sceneMode:state.sceneMode,scene:state.sceneMode==='keep'?(t.scene||'模板示例场景'):state.sceneMode==='brand'?b.name:state.sceneNote.trim()||'自定义环境图片',sceneImage:state.sceneMode==='keep'?(t.sceneImage||t.image||storeArt):state.sceneMode==='brand'?(b.photos[0]||''):state.sceneImage||storeArt,extraRequirements:state.extraRequirements.trim()}}
function configValidation(){if(state.sceneMode==='brand'&&!brand().photos.length)return '该素材组没有门店照片，请先添加照片或选择其他环境';if(state.sceneMode==='custom'&&!state.sceneImage&&!state.sceneNote.trim())return '请填写环境描述或上传环境参考图';return ''}
function templateConfig(inModal=false){const t=selectedTemplate(),c=configData(),suffix=inModal?'modal':'page';return `<section class="template-config ${inModal?'in-modal':'panel'}"><div class="panel-head"><div><h2>${inModal?'':'<span class="number">03</span>'}模板确定了，主角和场景呢？</h2><p class="panel-sub">${esc(t.title)} · 动作节奏与镜头结构沿用模板</p></div><span class="badge">可直接生成</span></div><div class="config-grid"><div class="config-block"><div class="config-label">人物 <span>${esc(t.person||'模板虚拟顾客')}</span></div><div class="option-row">${[['keep','沿用模板人物'],['replace','替换人物']].map(([v,n])=>`<button class="choice ${state.personMode===v?'active':''}" data-person-mode="${v}" aria-pressed="${state.personMode===v}">${state.personMode===v?'✓ ':''}${n}</button>`).join('')}</div>${state.personMode==='replace'?`<div class="field"><label for="personRole-${suffix}">换成谁？</label><select id="personRole-${suffix}" data-config-field="personRole">${['品牌店员','普通顾客','虚拟代言人','自定义人物'].map(v=>`<option ${v===state.personRole?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label class="sr-only" for="personNote-${suffix}">人物描述</label><input id="personNote-${suffix}" data-config-field="personNote" value="${esc(state.personNote)}" placeholder="选填：穿绿色围裙，短发，动作自然" maxlength="300"></div><div class="reference-mini">${state.personImage?`<img src="${state.personImage}" alt="人物参考"><button class="text-btn" data-action="cfg-remove-person">移除</button>`:''}<button class="text-btn" data-action="cfg-upload-person">${icon('upload')} ${state.personImage?'更换':'上传'}人物参考图（选填）</button></div>`:'<p class="choice-hint">保留模板中的人物设定、动作和服装。</p>'}</div><div class="config-block"><div class="config-label">环境 <span>${esc(t.scene||'模板示例场景')}</span></div><div class="option-row">${[['keep','沿用模板环境'],['brand','换成我的门店'],['custom','自定义环境']].map(([v,n])=>`<button class="choice ${state.sceneMode===v?'active':''}" data-scene-mode="${v}" aria-pressed="${state.sceneMode===v}">${state.sceneMode===v?'✓ ':''}${n}</button>`).join('')}</div>${state.sceneMode==='brand'?`<div class="scene-reference">${brand().photos[0]?`<img src="${brand().photos[0]}" alt="当前门店照片">`:'<span>尚未添加照片</span>'}<div><strong>${esc(brand().name)}</strong><p>复用固定素材组，无需重复上传</p></div></div>`:state.sceneMode==='custom'?`<div class="field"><label class="sr-only" for="sceneNote-${suffix}">环境描述</label><input id="sceneNote-${suffix}" data-config-field="sceneNote" value="${esc(state.sceneNote)}" placeholder="例如：明亮露台，午后自然光" maxlength="300"></div><div class="reference-mini">${state.sceneImage?`<img src="${state.sceneImage}" alt="环境参考"><button class="text-btn" data-action="cfg-remove-scene">移除</button>`:''}<button class="text-btn" data-action="cfg-upload-scene">${icon('upload')} ${state.sceneImage?'更换':'上传'}环境参考图（选填）</button></div>`:'<p class="choice-hint">沿用模板的背景与光线，换成自己的商品。</p>'}</div></div><div class="field extra-field"><label for="extra-${suffix}">还有什么想交代的？ <span>选填 · 会随作品写入脚本与 Prompt</span></label><textarea id="extra-${suffix}" data-config-field="extraRequirements" maxlength="1000" placeholder="例如：保留闪身动作，人物换成穿绿色围裙的店员；门头要清晰；前 3 秒突出 19.9 元，不要配音。">${esc(state.extraRequirements)}</textarea><p class="choice-hint">可填写镜头、语气、字幕、配音或不希望出现的内容。人物和环境的结构化选择以本面板为准。</p></div>${inModal?'':`<div class="config-summary"><span>本次：${state.personMode==='keep'?'沿用人物':'替换人物'} · ${state.sceneMode==='keep'?'沿用环境':state.sceneMode==='brand'?'自家门店':'自定义环境'}</span><button class="text-btn" data-action="cfg-open">预览设置 ${icon('arrow')}</button></div>`}</section>`}
filters=function(){return `<div class="chips">${['全部','抖音热梗','烘焙茶饮','餐饮美食','到店探店'].map(c=>`<button class="chip ${state.category===c?'active':''}" data-category="${c}">${c}</button>`).join('')}</div>`};
renderCreate=function(){return baseRenderCreate().replace('<div class="generation-bar">',templateConfig()+'<div class="generation-bar">').replace('商品 + 品牌 + 灵感，准备就绪','商品 + 品牌 + 模板，确认后开拍')};
function showTemplateSettings(){showModal(modalHead('用这个模板，怎么拍？','人物和环境可以分别替换，也能直接沿用模板。')+`<div class="selected-template-preview"><img src="${selectedTemplate().image||selectedTemplate().sceneImage}" alt="模板示意"><div><span class="badge warm">虚拟模板 · 非实时热榜</span><h3>${esc(selectedTemplate().title)}</h3><p>保留内容结构与动作节奏，代入你的商品和品牌。</p></div></div>`+templateConfig(true)+`<div class="modal-actions"><button class="secondary" data-action="cfg-save">保存设置，继续编辑</button><button class="secondary" data-action="cfg-direct">沿用模板，直接生成</button><button class="primary" data-action="cfg-generate">按当前设置生成 ${icon('arrow')}</button></div>`)}
function refreshConfig(){if($('#modal').open&&$('#extra-modal'))showTemplateSettings();else render()}
function syncConfigInput(e){const k=e.target.dataset.configField;if(!k)return;state[k]=e.target.value;state.configConfirmed=false;$$(`[data-config-field="${k}"]`).filter(n=>n!==e.target).forEach(n=>n.value=state[k])}
document.addEventListener('input',syncConfigInput);document.addEventListener('change',syncConfigInput);
loadRef=function(f){state.configConfirmed=false;baseLoadRef(f)};
generate=function(){if(!state.name.trim()||!state.selling.trim()||!Number.isFinite(+state.price)||+state.price<=0)return toast('请填写商品名称、有效团购价与核心卖点');if(state.original&&+state.original<+state.price)return toast('日常价应不低于团购价，请核对价格');if(state.tab==='upload'&&!state.refName)return toast('请先上传参考视频，或使用示例');const err=configValidation();if(err)return toast(err);if(!state.configConfirmed)return showTemplateSettings();state.resultVideo='';state.resultVideoName='';baseGenerate()};
buildResult=function(){const w=baseBuildResult(),c=configData(),t=selectedTemplate();w.templateSettings=c;w.extraRequirements=c.extraRequirements;w.sceneImage=c.sceneImage;w.personImage=c.personImage;w.templateImage=t.image||t.sceneImage||storeArt;w.person=c.person;w.scene=c.scene;w.store=c.sceneImage;w.hook=t.hook||'今天，给自己一点小奖励';w.style=t.style||'按参考视频节奏，展示商品与优惠';w.shots[0].desc=`${w.hook}。人物：${c.person}；环境：${c.scene}。${w.style}。`;w.shots[1].desc=`${w.selling}。${c.personMode==='replace'?'由替换后人物演示商品，保持动作连续':'沿用模板人物动作与节奏'}。`;w.shots[3].desc=`在「${c.scene}」场景收尾，叠加 ${w.brandName} 原始 Logo 与到店引导。`;if(c.extraRequirements)w.shots.push({time:'全片',name:'商家补充要求',desc:c.extraRequirements+'（待生成执行；演示仅记录）'});return w};
resultPrompt=function(w){const c=w.templateSettings;return `【商家适配 Prompt · 演示】\n规格：9:16，15 秒；${w.style}。\n商品：${w.name}\n卖点：${w.selling}\n团购价：¥${w.price}${w.original?'，日常价 ¥'+w.original:''}\n利益点：${w.benefit}\n品牌：${w.brandName}\n模板：${w.trend}\n\n【人物与环境确认】\n人物：${c?.personMode==='replace'?'替换':'沿用模板'}；${c?.person||'模板人物'}。${w.personImage?'已附人物参考图。':''}\n环境：${c?.sceneMode==='brand'?'替换为品牌门店':c?.sceneMode==='custom'?'替换为自定义环境':'沿用模板环境'}；${c?.scene||'模板环境'}。\n保留动作节奏、镜头顺序及主要转场。人物和环境以以上结构化选择为准；补充文字中的冲突要求应在生成前确认。\n\n【分镜脚本】\n${w.shots.map(s=>s.time+' '+s.name+'：'+s.desc).join('\n')}\n\n【商家额外需求】\n${w.extraRequirements||'无额外要求'}\n\n【品牌一致性】\nLogo 原图叠加，等比缩放、保留原色，${w.position}；仅在选择品牌门店环境时使用固定门店图，不得改写门头招牌。\n结尾品牌页：${w.end?'展示品牌与当前场景':'不额外展示'}。\n不得新增未提供的商品规格、优惠条件和门店承诺。\n说明：模板、分析和预览为虚拟演示，未进行真实 AI 视频生成。`};
phoneMarkup=function(w,controls=true){let html=basePhoneMarkup(w,controls);if(w.templateSettings&&!state.resultVideo){const labels=`<div class="phone-config-label">${esc(w.templateSettings.personMode==='keep'?'模板人物':w.templateSettings.person)} · ${esc(w.templateSettings.sceneMode==='keep'?'模板环境':w.templateSettings.scene)}</div>`;html=html.replace('<div class="phone-bottom">',labels+'<div class="phone-bottom">');if(controls)html=html.replace(`src="${w.product}"`,`src="${w.sceneImage||w.product}"`)}return html};
startPlayer=function(w){playSec=0;playing=true;playTimer=setInterval(()=>{if(!playing)return;playSec=(playSec+.2)%15;const idx=playSec<3?0:playSec<7?1:playSec<11?2:3;const captions=[w.hook,w.selling.split(/[·，,]/).slice(0,2).join('\n'),`¥${w.price}\n${w.benefit}`,`来 ${w.brandName}\n享受这一刻`];if($('#phoneCaption'))$('#phoneCaption').textContent=captions[idx];if($('#phoneBg'))$('#phoneBg').src=idx===0||idx===3?(w.sceneImage||w.store):w.product;if($('#phoneLogo'))$('#phoneLogo').style.display=w.position==='仅结尾'?(idx===3&&w.end?'block':'none'):(idx===3&&!w.end?'none':'block');if($('#playProgress'))$('#playProgress').style.width=playSec/15*100+'%';if($('#playTime'))$('#playTime').textContent=`00:${Math.floor(playSec).toString().padStart(2,'0')} / 00:15`},200)};
showResult=function(w,tab='script'){baseShowResult(w,tab);if(w.templateSettings){const el=document.createElement('div');el.className='applied-config';el.innerHTML=`<strong>已确认的生成设置</strong><p>人物：${esc(w.templateSettings.person)}<br>环境：${esc(w.templateSettings.scene)}${w.extraRequirements?'<br>额外要求：'+esc(w.extraRequirements):''}</p><small>设置已写入脚本和 Prompt；动态分镜为占位演示。导入的预制成片按原文件播放。</small>`;$('#modalContent .result-banner').after(el)}if(state.resultVideo){const hint=$('#modalContent .result-grid>div>p');if(hint)hint.textContent='预制视频原样预览 · 未按新设置重生成'}};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;try{if(b.dataset.trend!==undefined){e.stopImmediatePropagation();state.trend=+b.dataset.trend;state.tab='recommend';state.page='create';state.configConfirmed=false;render();showTemplateSettings();return}if(b.dataset.personMode){e.stopImmediatePropagation();state.personMode=b.dataset.personMode;state.configConfirmed=false;refreshConfig();return}if(b.dataset.sceneMode){e.stopImmediatePropagation();state.sceneMode=b.dataset.sceneMode;state.configConfirmed=false;refreshConfig();return}if(!action?.startsWith('cfg-')){if(b.dataset.tab||['no-trend','sample-ref','go-upload','sample'].includes(action))state.configConfirmed=false;return}e.stopImmediatePropagation();switch(action){case 'cfg-open':showTemplateSettings();break;case 'cfg-save':closeModal();render();toast('人物、环境与额外需求已保留');break;case 'cfg-direct':state.personMode='keep';state.sceneMode='keep';state.configConfirmed=true;render();generate();break;case 'cfg-generate':{const err=configValidation();if(err){toast(err);break}state.configConfirmed=true;render();generate();break}case 'cfg-upload-person':pick('image/png,image/jpeg,image/webp',async f=>{if(!f)return;state.personImage=await compressedImage(f);state.configConfirmed=false;refreshConfig()});break;case 'cfg-upload-scene':pick('image/png,image/jpeg,image/webp',async f=>{if(!f)return;state.sceneImage=await compressedImage(f);state.configConfirmed=false;refreshConfig()});break;case 'cfg-remove-person':state.personImage='';state.configConfirmed=false;refreshConfig();break;case 'cfg-remove-scene':state.sceneImage='';state.configConfirmed=false;refreshConfig();break}}catch(err){toast(err.message||'操作失败，请重试')}},true);
const previousBindFields=bindFields;bindFields=function(){previousBindFields();const select=$('#activeBrand');if(select){const change=select.onchange;select.onchange=e=>{state.configConfirmed=false;change(e)}}};
$('#modal').addEventListener('close',()=>{if(state.page==='create'&&!$('#modal').open)render()});
icons();render();
</script></body></html>
